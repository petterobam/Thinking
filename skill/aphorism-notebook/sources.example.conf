# 思笺 · 自定义思考方向（素材来源）
#
# 每个 [代号] = 一个自定义思考方向：把你自己的知识库、笔记、访谈稿、书摘、代码仓库
# 变成这张卡片的思考起点。A–E 是内置模式，自定义方向从 F 开始。
#
# 字段：
#   name             方向名字（必填）
#   paths            素材路径，逗号分隔（必填）。支持 ~、目录、单个文件、* 通配
#   rounds           不配置思考强度时这个方向的默认轮数，2–12（默认 4）
#   emoji            可选，显示用
#   hint             可选，一句话：怎么从这些素材里找素材
#   rounds_template  可选，自定义轮次题目，用 | 分隔
#
# 例（去掉行首 # 即可生效）：
# [F]
# name=旧笔记考古
# emoji=🗂
# paths=~/Documents/Obsidian/我的仓库, ~/notes/2026.md
# rounds=5
# hint=先看最近 7 天改动过的笔记，找反复出现的词
# rounds_template=翻旧轮：翻到最近 7 天动过的一篇|对照轮：它和我今天想的这件事像在哪|反驳轮：旧的我错了吗
#
# 改完自检：bash assets/sources.sh check
# 看解析结果：bash assets/rounds.sh
